<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#102C3A" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="ZeitApp — Arbeitszeit einfach im Blick."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZeitApp" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="./manifest.json" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icons/timeapp-icon-192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./icons/timeapp-icon-180.png"
    />
    <link
      rel="apple-touch-startup-image"
      href="./icons/timeapp-splash.png"
    />
    <title>ZeitApp</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        min-height: 100%;
        background: #f5f7f8;
      }

      body {
        overflow: hidden;
        margin: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        overscroll-behavior-y: none;
        -webkit-text-size-adjust: 100%;
      }

      #root {
        display: flex;
        min-height: 100%;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Bitte aktivieren Sie JavaScript, um ZeitApp zu nutzen.</noscript>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./service-worker.js", {
            scope: "./",
          });
        });
      }
    </script>
  </body>
</html>
