kind = "mobile"
previewPath = "/timeapp/"
title = "TimeApp"
description = "A professional German-language employee time tracking app for companies in Germany. Employees can sign in, start and stop their workday, and view today's working hours."
version = "1.0.0"
id = "artifacts/timeapp"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/timeapp/" ]
localPort = 19212

[services.development]
run = "pnpm --filter @workspace/timeapp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/timeapp", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/timeapp", "run", "serve" ]

[services.env]
PORT = "19212"
BASE_PATH = "/timeapp/"
