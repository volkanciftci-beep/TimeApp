openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: timeapp
    description: Authenticated employee time tracking
  - name: company
    description: Company owner and manager administration
  - name: billing
    description: Company subscription management
paths:
  /timeapp/auth/employee-identifier:
    post:
      operationId: resolveTimeAppEmployeeIdentifier
      tags: [timeapp]
      summary: Resolve an employee or manager login identifier
      description: Validates a company name or company code with an employee ID and returns the linked Clerk login identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeLoginIdentifierRequest"
      responses:
        "200":
          description: Canonical employee login identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeLoginIdentifierResponse"
        "400":
          description: Invalid login input
        "404":
          description: No matching active employee or manager
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /timeapp/me:
    get:
      operationId: getTimeAppMe
      tags: [timeapp]
      summary: Get the signed-in employee dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Employee dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeAppMeResponse"
        "401":
          description: Authentication required
  /timeapp/clock/start:
    post:
      operationId: startTimeAppWork
      tags: [timeapp]
      summary: Start the employee workday
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workday started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockMutationResponse"
        "409":
          description: A work session is already active
  /timeapp/clock/stop:
    post:
      operationId: stopTimeAppWork
      tags: [timeapp]
      summary: End the active work session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workday ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockMutationResponse"
        "409":
          description: No work session is active
  /timeapp/breaks/start:
    post:
      operationId: startTimeAppBreak
      tags: [timeapp]
      summary: Start a break in the active work session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Break started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockMutationResponse"
        "409":
          description: A break is already active or no work session is active
  /timeapp/breaks/stop:
    post:
      operationId: stopTimeAppBreak
      tags: [timeapp]
      summary: End the active break
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Break ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockMutationResponse"
        "409":
          description: No break is active
  /timeapp/history:
    get:
      operationId: getTimeAppHistory
      tags: [timeapp]
      summary: Get the employee's work history
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Work history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
  /timeapp/summary:
    get:
      operationId: getTimeAppSummary
      tags: [timeapp]
      summary: Get a weekly or monthly work summary
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [week, month]
            default: week
      responses:
        "200":
          description: Work summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
  /timeapp/onboarding/company:
    post:
      operationId: createTimeAppCompany
      tags: [company]
      summary: Create a company account for the signed-in owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyOnboardingResponse"
        "409":
          description: Account already belongs to a company
  /timeapp/company:
    get:
      operationId: getTimeAppCompany
      tags: [company]
      summary: Get the current company and role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
  /timeapp/company/members:
    get:
      operationId: getTimeAppCompanyMembers
      tags: [company]
      summary: List members in the current tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyMembersResponse"
    post:
      operationId: createTimeAppCompanyMember
      tags: [company]
      summary: Create a managed employee or manager account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Member created with one-time credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCredentialsResponse"
  /timeapp/company/members/{userId}/status:
    patch:
      operationId: updateTimeAppCompanyMemberStatus
      tags: [company]
      summary: Activate or deactivate a member
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberStatusRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
  /timeapp/company/members/{userId}/temporary-password:
    post:
      operationId: resetTimeAppCompanyMemberTemporaryPassword
      tags: [company]
      summary: Create a new one-time temporary password for a managed member
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Temporary password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCredentialsResponse"
        "403":
          description: The signed-in role cannot reset this member
        "404":
          description: The member does not exist in the signed-in user's company
        "409":
          description: The target is not a ZEITAPP-managed account
  /timeapp/company/members/{userId}:
    delete:
      operationId: deleteTimeAppCompanyMember
      tags: [company]
      summary: Delete a member and their time records
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member deleted
  /timeapp/company/reports:
    get:
      operationId: getTimeAppCompanyReports
      tags: [company]
      summary: Get tenant-scoped work reports
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [week, month]
            default: week
      responses:
        "200":
          description: Tenant report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyReportsResponse"
  /timeapp/schedule:
    get:
      operationId: getTimeAppSchedule
      tags: [schedule]
      summary: Get the signed-in employee's weekly schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WeekStart"
      responses:
        "200":
          description: Personal weekly schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySchedule"
  /timeapp/company/members/{userId}/schedule:
    get:
      operationId: getTimeAppCompanyMemberSchedule
      tags: [schedule]
      summary: Get a tenant member's weekly schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Member weekly schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySchedule"
    put:
      operationId: updateTimeAppCompanyMemberSchedule
      tags: [schedule]
      summary: Create or replace a tenant member's weekly schedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyScheduleUpdate"
      responses:
        "200":
          description: Saved weekly schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySchedule"
  /timeapp/billing/plans:
    get:
      operationId: getTimeAppBillingPlans
      tags: [billing]
      summary: List active recurring Stripe plans
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlansResponse"
  /timeapp/billing/checkout:
    post:
      operationId: createTimeAppBillingCheckout
      tags: [billing]
      summary: Create an owner-only Stripe subscription checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutRequest"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUrlResponse"
  /timeapp/billing/portal:
    post:
      operationId: createTimeAppBillingPortal
      tags: [billing]
      summary: Create an owner-only Stripe customer portal session
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingPortalRequest"
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUrlResponse"
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    WeekStart:
      name: weekStart
      in: query
      required: false
      schema:
        type: string
        format: date
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    EmployeeLoginIdentifierRequest:
      type: object
      properties:
        companyCode:
          type: string
        employeeId:
          type: string
      required: [companyCode, employeeId]
    EmployeeLoginIdentifierResponse:
      type: object
      properties:
        identifier:
          type: string
      required: [identifier]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EmployeeProfile:
      type: object
      properties:
        userId:
          type: string
        employeeId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [owner, manager, employee]
        hourlyRateCents:
          type: integer
      required: [userId, employeeId, email, displayName, role, hourlyRateCents]
    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        companyCode:
          type: string
        subscriptionStatus:
          type: string
        plan:
          type: string
        hasActiveSubscription:
          type: boolean
        hasTeamAccess:
          type: boolean
        isDevelopmentMode:
          type: boolean
        trialEndsAt:
          type: string
          format: date-time
      required: [id, name, companyCode, subscriptionStatus, plan, hasActiveSubscription, hasTeamAccess, isDevelopmentMode, trialEndsAt]
    CompanyMember:
      type: object
      properties:
        userId:
          type: string
        employeeId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [owner, manager, employee]
        status:
          type: string
          enum: [active, inactive]
        hourlyRateCents:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [userId, employeeId, email, displayName, role, status, hourlyRateCents, createdAt]
    CreateCompanyRequest:
      type: object
      properties:
        name:
          type: string
      required: [name]
    CompanyOnboardingResponse:
      type: object
      properties:
        company:
          $ref: "#/components/schemas/Company"
        employeeId:
          type: string
      required: [company, employeeId]
    CompanyResponse:
      type: object
      properties:
        company:
          $ref: "#/components/schemas/Company"
        currentUser:
          $ref: "#/components/schemas/CompanyMember"
      required: [company, currentUser]
    CompanyMembersResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/CompanyMember"
      required: [members]
    CreateMemberRequest:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [manager, employee]
        hourlyRateCents:
          type: integer
      required: [displayName, email]
    MemberCredentialsResponse:
      type: object
      properties:
        member:
          $ref: "#/components/schemas/CompanyMember"
        companyCode:
          type: string
        temporaryPassword:
          type: string
      required: [member, companyCode, temporaryPassword]
    MemberStatusRequest:
      type: object
      properties:
        active:
          type: boolean
      required: [active]
    MemberResponse:
      type: object
      properties:
        member:
          $ref: "#/components/schemas/CompanyMember"
      required: [member]
    WeeklyScheduleDay:
      type: object
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        isWorking:
          type: boolean
        startTime:
          type: string
          nullable: true
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          nullable: true
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        breakMinutes:
          type: integer
          minimum: 0
          maximum: 720
      required: [weekday, isWorking, startTime, endTime, breakMinutes]
    WeeklySchedule:
      type: object
      properties:
        userId:
          type: string
        weekStart:
          type: string
          format: date
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/WeeklyScheduleDay"
      required: [userId, weekStart, days]
    WeeklyScheduleUpdate:
      type: object
      properties:
        weekStart:
          type: string
          format: date
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/WeeklyScheduleDay"
      required: [weekStart, days]
    CompanyReport:
      type: object
      properties:
        userId:
          type: string
        employeeId:
          type: string
        displayName:
          type: string
        totalWorkSeconds:
          type: integer
        totalBreakSeconds:
          type: integer
        workingDays:
          type: integer
      required: [userId, employeeId, displayName, totalWorkSeconds, totalBreakSeconds, workingDays]
    CompanyReportsResponse:
      type: object
      properties:
        period:
          type: string
          enum: [week, month]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        reports:
          type: array
          items:
            $ref: "#/components/schemas/CompanyReport"
      required: [period, from, to, reports]
    BillingPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        priceId:
          type: string
        unitAmount:
          type: integer
          nullable: true
        currency:
          type: string
        recurring:
          type: object
          nullable: true
      required: [id, priceId, currency]
    BillingPlansResponse:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/BillingPlan"
      required: [plans]
    BillingCheckoutRequest:
      type: object
      properties:
        priceId:
          type: string
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
      required: [priceId]
    BillingPortalRequest:
      type: object
      properties:
        returnUrl:
          type: string
          format: uri
    BillingUrlResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          nullable: true
      required: [url]
    BreakEntry:
      type: object
      properties:
        id:
          type: integer
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
      required: [id, startedAt, endedAt, durationSeconds]
    HistoryEntry:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        grossSeconds:
          type: integer
        breakSeconds:
          type: integer
        netSeconds:
          type: integer
        breaks:
          type: array
          items:
            $ref: "#/components/schemas/BreakEntry"
      required: [id, date, startedAt, endedAt, grossSeconds, breakSeconds, netSeconds, breaks]
    ClockStatus:
      type: object
      properties:
        status:
          type: string
          enum: [off_duty, on_duty, on_break]
        currentSessionId:
          type: integer
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        activeSeconds:
          type: integer
        breakSeconds:
          type: integer
        todayNetSeconds:
          type: integer
      required: [status, currentSessionId, startedAt, activeSeconds, breakSeconds, todayNetSeconds]
    Summary:
      type: object
      properties:
        period:
          type: string
          enum: [week, month]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalWorkSeconds:
          type: integer
        totalBreakSeconds:
          type: integer
        workingDays:
          type: integer
        averageWorkSeconds:
          type: integer
        estimatedGrossCents:
          type: integer
      required: [period, from, to, totalWorkSeconds, totalBreakSeconds, workingDays, averageWorkSeconds, estimatedGrossCents]
    HistoryResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
      required: [entries]
    TimeAppMeResponse:
      type: object
      properties:
        employee:
          $ref: "#/components/schemas/EmployeeProfile"
        company:
          $ref: "#/components/schemas/Company"
        clock:
          $ref: "#/components/schemas/ClockStatus"
        week:
          $ref: "#/components/schemas/Summary"
        month:
          $ref: "#/components/schemas/Summary"
      required: [employee, company, clock, week, month]
    ClockMutationResponse:
      type: object
      properties:
        message:
          type: string
        clock:
          $ref: "#/components/schemas/ClockStatus"
      required: [message, clock]

